<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Preview ZPL labels as PNG or SVG locally in your browser." />
    <title>zebrash · ZPL viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>zebrash <span>/ ZPL viewer</span></h1>
        <p>Render labels locally in your browser. Your ZPL is never uploaded.</p>
      </div>
      <a href="https://github.com/Fountain-Bio/zebrash-ts">View on GitHub</a>
    </header>

    <main class="workspace">
      <section class="editor-panel" aria-labelledby="editor-heading">
        <div class="panel-heading">
          <div>
            <h2 id="editor-heading">ZPL source</h2>
            <span id="source-stats">0 characters</span>
          </div>
          <label class="example-picker">
            Example
            <select id="example-select">
              <option value="">Custom label</option>
            </select>
          </label>
        </div>

        <label class="visually-hidden" for="zpl-input">ZPL source</label>
        <textarea
          id="zpl-input"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-describedby="editor-help"
        ></textarea>
        <p id="editor-help" class="editor-help">
          Changes render automatically. Press Ctrl/⌘ + Enter to render now.
        </p>

        <fieldset class="settings">
          <legend>Label settings</legend>
          <label>
            Width
            <span class="input-with-unit">
              <input id="label-width" type="number" min="0.1" max="1000" step="0.1" value="101.6" />
              <span>mm</span>
            </span>
          </label>
          <label>
            Height
            <span class="input-with-unit">
              <input
                id="label-height"
                type="number"
                min="0.1"
                max="1000"
                step="0.1"
                value="203.2"
              />
              <span>mm</span>
            </span>
          </label>
          <label>
            Print density
            <select id="print-density">
              <option value="6">6 dpmm (152 dpi)</option>
              <option value="8" selected>8 dpmm (203 dpi)</option>
              <option value="12">12 dpmm (300 dpi)</option>
              <option value="24">24 dpmm (600 dpi)</option>
            </select>
          </label>
          <label>
            SVG fonts
            <select id="svg-font-mode">
              <option value="url" selected>CDN URL</option>
              <option value="embed">Embedded</option>
              <option value="none">System fonts</option>
            </select>
          </label>
          <label class="check-setting">
            <input id="grayscale-output" type="checkbox" />
            Grayscale PNG
          </label>
          <label class="check-setting">
            <input id="enable-inverted" type="checkbox" checked />
            Honor inverted labels
          </label>
        </fieldset>

        <div class="editor-actions">
          <button id="render-button" type="button" class="primary">Render label</button>
          <button id="share-button" type="button">Copy share link</button>
        </div>
      </section>

      <section class="preview-panel" aria-labelledby="preview-heading">
        <div class="preview-toolbar">
          <div>
            <h2 id="preview-heading">Preview</h2>
            <div id="status" class="status" role="status" aria-live="polite">Starting…</div>
          </div>
          <nav class="label-nav" aria-label="Rendered labels">
            <button id="previous-label" type="button" aria-label="Previous label">Previous</button>
            <span id="label-position">Label 0 of 0</span>
            <button id="next-label" type="button" aria-label="Next label">Next</button>
          </nav>
        </div>

        <div id="error-message" class="error-message" role="alert" hidden></div>

        <div class="preview-grid">
          <article class="preview-card">
            <div class="card-heading">
              <div>
                <h3>PNG</h3>
                <span id="png-stats"></span>
              </div>
              <div class="download-group">
                <a id="png-download" class="download" hidden>Download PNG</a>
                <button id="pdf-download" class="download" type="button" hidden>
                  Download PDF
                </button>
              </div>
            </div>
            <div class="canvas-wrap">
              <img id="png-preview" alt="Rendered ZPL label as PNG" />
            </div>
          </article>

          <article class="preview-card">
            <div class="card-heading">
              <div>
                <h3>SVG</h3>
                <span id="svg-stats"></span>
              </div>
              <a id="svg-download" class="download" hidden>Download SVG</a>
            </div>
            <div class="canvas-wrap">
              <object
                id="svg-preview"
                type="image/svg+xml"
                aria-label="Rendered ZPL label as SVG"
              ></object>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
